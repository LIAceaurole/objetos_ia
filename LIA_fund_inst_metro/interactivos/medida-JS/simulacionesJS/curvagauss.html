<body>

<ajs name="Curva de Gauss" width=480 height=360

        archive="lib/Descartes5.jar"

   <param name="tama&ntilde;o" value="480x360">
   <param name="decimal_symbol" value=",">

   <param name="nombre" value="Curva de Gauss">
   <param name="Versi&oacute;n" value="5.202, 2013-10-22">
   <param name="Idioma" value="espa&ntilde;ol">
   <param name="Botones" value="cr&eacute;ditos=no config=no inicio=s&iacute; limpiar=no">
   <param name="E_01" value="tipo='R2' despl_imagen='arr-izq' fondo='negro' red='no' red10='no' ejes='gris' texto='rosa'">

   <param name="A_01" value="id='pi' constante='s&iacute;' expresi&oacute;n='3.1416' evaluar='una-sola-vez'">

</ajs>
