   <param name="C_02" value="id='n2' tipo='num&eacute;rico' interfaz='bot&oacute;n' regi&oacute;n='norte' nombre='Actividad' fijo='no' visible='s&iacute;' acci&oacute;n='mensaje' par&aacute;metro='Supongamos que has efectuado las tres medidas que se muestran. Calcula el porcentaje de dispersi&oacute;n de las medidas y seg&uacute;n el valor obtenido indica si debes realizar m&aacute;s o ya son suficientes para tomar a partir de ellas el valor representativo de dichas medidas.\nRecuerda que el %D se halla: restando del valor m&aacute;ximo el m&iacute;nimo, multiplic&aacute;ndolo por cien y dividi&eacute;ndolo entre la media aritm&eacute;tica.\nPulsa en -inicio. para un nuevo ejercicio ' pos_mensajes='centro'">

   <param name="A_02" value="algoritmo='s&iacute;' evaluar='una-sola-vez' inicio='i=0' hacer='a=ent(1000*rnd)/1000;a=(a=0)?0.01:a;b=ent(100*rnd)/1000;a[i]=a+b;a[i+1]=a-b;a[i+2]=a;max=(a[i+1]&gt;a[i])?a[i+1]:a[i];max=(a[i+2]&gt;max)?a[i+2]:max;min=(a[i+1]&lt;a[i])?a[i+1]:a[i];min=(a[i+2]&lt;min)?a[i+2]:min;d=(max-min)*100/(3*a);'">
   <param name="G_01" value="tipo='texto' color='azul' expresi&oacute;n='[20,40]' texto='{\rtf1\uc0{\fonttbl\f0\fcharset0 Times New Roman;\f1\fcharset0 Arial;\f2\fcharset0 Courier New;}\f1\fs30 Valor de la primera medida ={\*\mjaformula{\expr a+b}}\f2\fs30}' fuente='SansSerif,PLAIN,15' fijo='s&iacute;'">
   <param name="G_02" value="tipo='texto' color='azul' expresi&oacute;n='[20,60]' texto='{\rtf1\uc0{\fonttbl\f0\fcharset0 Times New Roman;\f1\fcharset0 Arial;\f2\fcharset0 Courier New;}\f1\fs30 Valor de la segunda medida ={\*\mjaformula{\expr a-b}}\f2\fs30}' fuente='SansSerif,PLAIN,15' fijo='s&iacute;'">
   <param name="G_03" value="tipo='texto' color='azul' expresi&oacute;n='[20,80]' texto='{\rtf1\uc0{\fonttbl\f0\fcharset0 Times New Roman;\f1\fcharset0 Arial;\f2\fcharset0 Courier New;}\f1\fs30 Valor de la tercera medida ={\*\mjaformula{\expr a}}\f2\fs30}' fuente='SansSerif,PLAIN,15' fijo='s&iacute;'">
   <param name="G_04" value="tipo='texto' color='azul' expresi&oacute;n='[20,120]' texto='{\rtf1\uc0{\fonttbl\f0\fcharset0 Times New Roman;\f1\fcharset0 Arial;\f2\fcharset0 Courier New;}\f1\fs30\u191 Es {\*\mjaformula{\expr d}}  el valor del % la dispersi\u243 n (%D)?\f2\fs30}' fuente='SansSerif,PLAIN,15' fijo='s&iacute;'">
   <param name="G_05" value="tipo='texto' color='rojo' dibujar-si='(p=1)&amp;(d&gt;5)' expresi&oacute;n='[20,140]' texto='{\rtf1\uc0{\fonttbl\f0\fcharset0 Times New Roman;\f1\fcharset0 Arial;\f2\fcharset0 Courier New;}\f1\fs30\b Muy bien \u161 Acertaste! \f2\fs30\b0}' fuente='SansSerif,BOLD,15' fijo='s&iacute;'">
   <param name="G_06" value="tipo='texto' color='rojo' dibujar-si='(p=2)&amp;(d&lt;5)' expresi&oacute;n='[20,140]' texto='{\rtf1\uc0{\fonttbl\f0\fcharset0 Times New Roman;\f1\fcharset0 Arial;\f2\fcharset0 Courier New;}\f1\fs30\b Muy bien \u161 Acertaste! \f2\fs30\b0}' fuente='SansSerif,BOLD,15' fijo='s&iacute;'">
   <param name="G_07" value="tipo='texto' color='rojo' dibujar-si='((p=1)&amp;(d&lt;5))|(p=2)&amp;(d&gt;5)' expresi&oacute;n='[20,140]' texto='{\rtf1\uc0{\fonttbl\f0\fcharset0 Times New Roman;\f1\fcharset0 Arial;\f2\fcharset0 Courier New;}\f1\fs30\b Lo siento! fallaste el % de D es mayor de 5 (es {\*\mjaformula{\expr d}})\f2\fs30\b0}' fuente='SansSerif,BOLD,15' fijo='s&iacute;'">
</ajs>
